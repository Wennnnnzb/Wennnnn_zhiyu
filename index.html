    <style>
        /* ========== 全局重置 & 梦幻背景 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Text', 'PingFang SC', Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background-image: url('background1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            /* 左右双栏布局：左侧头像+名字，右侧时钟+社交 */
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 56px;
            padding: 32px 40px;
            backdrop-filter: brightness(0.98);
        }

        /* ========== 左侧面板：头像 + 名字（垂直居中靠左） ========== */
	.left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    
            transform: translateX(-20px);   /* 向左移动20像素，数值越大越靠左 */
	}

        /* 头像毛玻璃圆底座（完全保留原有质感） */
        .avatar-glass {
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.25s ease;
        }

        .avatar-glass:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 32px rgba(0, 0, 0, 0.12);
        }

        /* 头像图片本身 */
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(74, 144, 226, 0.85);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            background: #f9fafc;
        }

        /* 名字 —— 位于头像正下方，优雅渐变文字，略微透明毛玻璃点缀 */

            line-height: 1.2;
        }

            letter-spacing: -0.2px;

            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            margin: 0;
            padding: 0 6px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border-radius: 48px;
        }

        /* ========== 右侧主要内容区（时钟 + 社交图标） ========== */
        .right-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            max-width: 460px;

/* 旋转动画 */
@keyframes spin {

}

}
	.music-btn:hover {

<script>
    // 实时时钟更新（24小时制）
function updateClock() {
    const now = new Date();
    // 时间部分
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const clockDiv = document.getElementById('live-clock');
    if (clockDiv) {
        clockDiv.textContent = `${hours}:${minutes}:${seconds}`;
    }
    // 日期部分
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const dateDiv = document.getElementById('live-date');
    if (dateDiv) {
        dateDiv.textContent = `${year}年${month}月${day}日`;
    }
}
    updateClock();
    setInterval(updateClock, 1000);
</script>   <!-- 这里必须关闭第一个 script -->

<div class="music-player">

<script>
    // 音乐控制 JS
    const playBtn = document.getElementById('playMusicBtn');
    const audio = document.getElementById('bgMusic');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
        if (isPlaying) {
            audio.pause();
            playBtn.classList.remove('rotating');
            isPlaying = false;
        } else {
            audio.play().catch(e => console.log('需要用户交互'));
            playBtn.classList.add('rotating');
            isPlaying = true;
        }
    });
    // 点赞功能（使用 countapi.xyz 永久计数，每人限一次）
    const LIKE_NAMESPACE = 'wennnnn_space';
    const LIKE_KEY = 'likes';

    function fetchLikeCount() {
        fetch(`https://api.countapi.xyz/get/${LIKE_NAMESPACE}/${LIKE_KEY}`)
            .then(res => res.json())
            .then(data => {
                const likeSpan = document.getElementById('likeCount');
                if (likeSpan) likeSpan.innerText = data.value;
            })
            .catch(e => console.log('点赞数获取失败', e));
    }

    function updateLike() {
        fetch(`https://api.countapi.xyz/hit/${LIKE_NAMESPACE}/${LIKE_KEY}`, { method: 'GET' })
            .then(res => res.json())
            .then(data => {
                const likeSpan = document.getElementById('likeCount');
                if (likeSpan) likeSpan.innerText = data.value;
            })
            .catch(e => console.log('点赞失败', e));
    }

    const likeBtn = document.getElementById('likeBtn');
    if (likeBtn) {
        const hasLiked = localStorage.getItem('hasLiked');
        if (hasLiked) {
            likeBtn.classList.add('disabled');
            likeBtn.disabled = true;
        } else {
            likeBtn.addEventListener('click', () => {
                updateLike();
                localStorage.setItem('hasLiked', 'true');
                likeBtn.classList.add('disabled');
                likeBtn.disabled = true;
            });
        }
        fetchLikeCount();
    }
</script>
